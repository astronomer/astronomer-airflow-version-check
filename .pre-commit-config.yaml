repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/astronomer/pre-commit-hooks
    rev: 37614dad793bbbdea699c63c8b341ce1e2bf855a
    hooks:
      - id: replace-en-dashes
      - id: replace-unicode-non-breaking-spaces
      - id: remove-unicode-zero-width-non-breaking-spaces
      - id: remove-unicode-zero-width-space
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        args: ["--py38-plus"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: lint-ui
        name: Lint UI (ESLint + TypeScript)
        description: ESLint and TypeScript type checking for version check UI files
        language: node
        files: |
          (?x)
          ^astronomer/airflow/version_check/www/.*\.(ts|tsx|js|jsx)$
        exclude: |
          (?x)
          ^astronomer/airflow/version_check/www/node_modules/.*|
          ^astronomer/airflow/version_check/www/.pnpm-store
        entry: scripts/ci/prek/ts_compile_lint_version_check.py
        additional_dependencies: ['pnpm@10.25.0']
        pass_filenames: true
        require_serial: true
      - id: compile-assets
        name: Compile version check UI assets
        language: node
        files: ^astronomer/airflow/version_check/www
        entry: scripts/ci/prek/compile_version_check_assets.py
        pass_filenames: false
        additional_dependencies: ['pnpm@10.25.0']
